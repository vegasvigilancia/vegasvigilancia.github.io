<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Formulário demissional | Vegas Vigilância e Segurança</title>
<script>
(function () {
  try {
    if (localStorage.getItem("vegas-connect-theme") === "dark") document.documentElement.setAttribute("data-theme", "dark");
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" />
<style>
  :root {
    --font-sans: Arial, Helvetica, sans-serif;
    --bg: #f5f5f5;
    --surface: #ffffff;
    --border: #e5e5e5;
    --border-control: #8f8f8f;
    --text: #111111;
    --muted: #666666;
    --primary: #1976d2;
    --danger: #d32f2f;
    --chip-bg: #f2f2f2;
    --shadow: 0 1px 6px rgba(0, 0, 0, 0.08);
    --radius-sm: 8px;
    --radius: 12px;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --border-control: #707070;
    --text: #c9d1d9;
    --muted: #8b949e;
    --primary: #1f6feb;
    --danger: #f85149;
    --chip-bg: #21262d;
    --shadow: 0 8px 24px rgba(1, 4, 9, 0.6);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.5;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  button { font: inherit; cursor: pointer; }
  .hidden { display: none !important; }

  .brand-logo { display: block; width: 220px; max-width: 100%; height: auto; }
  .brand-logo--dark { display: none; }
  :root[data-theme="dark"] .brand-logo--light { display: none; }
  :root[data-theme="dark"] .brand-logo--dark { display: block; }

  .theme-toggle-fixed { position: fixed; top: 10px; right: 28px; z-index: 50; }
  .theme-toggle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px;
    background: transparent; color: var(--text);
    border: 1px solid var(--border-control); border-radius: var(--radius-sm);
    transition: border-color 0.15s, color 0.15s;
  }
  .theme-toggle:hover { border-color: var(--primary); color: var(--primary); }
  .theme-toggle:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .theme-toggle .material-icons-outlined { font-size: 20px; line-height: 1; }

  .nps-page { flex: 1; display: flex; justify-content: center; padding: 56px 16px 32px; }
  .nps-card {
    width: 100%; max-width: 560px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px 24px;
    align-self: flex-start;
  }
  .nps-logo { display: flex; justify-content: center; margin-bottom: 16px; }
  .nps-titulo { text-align: center; font-size: 20px; letter-spacing: 0.06em; margin-bottom: 20px; }

  .nps-campo { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
  .nps-campo-rotulo { font-size: 12px; font-weight: 600; letter-spacing: 0.05em; color: var(--muted); }
  .nps-campo input[type="text"],
  .nps-campo input[type="date"],
  .nps-campo select {
    width: 100%; padding: 10px 12px;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border-control); border-radius: 4px;
    font: inherit;
  }
  .nps-campo input:focus,
  .nps-campo select:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
  .opcoes-acomp { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .opcoes-acomp > button { width: 100%; justify-content: center; text-align: center; white-space: normal; line-height: 1.25; }

  .obrigatorio { color: var(--danger); font-weight: 700; }

  .grupo-botoes { display: grid; grid-template-columns: 1fr; justify-items: stretch; gap: 10px; }
  .grupo-botoes--2col { grid-template-columns: repeat(2, 1fr); }
  .grupo-botoes > button { width: 100%; height: 100%; justify-content: center; text-align: center; white-space: normal; line-height: 1.25; }

  .btn-primary, .btn-ghost {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 9px 16px;
    border: 1px solid var(--primary); border-radius: 4px;
    font-size: 14px; font-weight: 600; text-transform: uppercase;
    white-space: nowrap; max-width: 100%;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover:not(:disabled) { opacity: 0.88; }
  .btn-primary:disabled { opacity: 0.5; cursor: default; }
  .btn-ghost { background: transparent; color: var(--text); border-color: var(--border-control); }
  .btn-ghost:hover:not(:disabled) { color: var(--primary); border-color: var(--primary); }
  .btn-ghost[aria-pressed="true"],
  .btn-ghost[aria-pressed="true"]:hover:not(:disabled) { background: var(--primary); color: #fff; border-color: var(--primary); }

  .sub-campo { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .nps-erro { color: #c62828; font-size: 14px; margin-bottom: 12px; text-align: center; }
  .nps-enviar { width: 100%; padding: 12px 16px; }
  .aviso-privacidade { text-align: center; font-size: 12px; color: var(--muted); margin: 12px 0 0; }
  .aviso-privacidade a { color: inherit; text-decoration: underline; }
  .armadilha { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

  .sucesso { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding: 8px 0; }
  .sucesso .material-icons-outlined { font-size: 48px; color: var(--primary); }
  .sucesso-protocolo { background: var(--chip-bg); border: 1px solid var(--border-control); border-radius: 8px; padding: 12px 28px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 24px; font-weight: 600; letter-spacing: 0.1em; overflow-wrap: anywhere; }


  @media (max-width: 640px) {
    .nps-card { padding: 20px 16px; }
    .theme-toggle-fixed { right: 16px; }
  }
  .nps-campo input[type="date"] { min-height: 42px; }
  .nps-campo select:disabled { opacity: 0.7; }
  .linha2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .valor-leitura { padding: 10px 12px; background: var(--chip-bg); color: var(--text); border: 1px solid var(--border-control); border-radius: 4px; min-height: 42px; }
  @media (max-width: 480px) { .linha2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="theme-toggle-fixed">
  <button type="button" class="theme-toggle" id="btn-tema" aria-label="Usar tema escuro" title="Usar tema escuro">
    <span class="material-icons-outlined" id="icone-tema" aria-hidden="true">dark_mode</span>
  </button>
</div>

<main class="nps-page">
  <div class="nps-card">
    <div class="nps-logo">
      <img class="brand-logo brand-logo--light" src="../assets/logo_name_black.png" alt="Vegas Vigilância" width="220" height="73" />
      <img class="brand-logo brand-logo--dark" src="../assets/logo_name_white.png" alt="Vegas Vigilância" width="220" height="73" />
    </div>
    <h1 class="nps-titulo">Formulário demissional</h1>

    <div id="erro-geral-box" style="display:none">
      <div class="nps-erro" id="erro-geral"></div>
    </div>

    <form id="form-demissao">
      <div class="nps-campo">
        <label class="nps-campo-rotulo" for="unidade">Unidade <span class="obrigatorio" aria-hidden="true">*</span></label>
        <select id="unidade" required>
          <option value="" disabled selected>Selecione</option>
          <option>Volta Redonda</option>
          <option>Niterói</option>
        </select>
      </div>
      <div class="nps-campo">
        <label class="nps-campo-rotulo" for="bloco">Bloco <span class="obrigatorio" aria-hidden="true">*</span></label>
        <select id="bloco" required>
          <option value="" disabled selected>Selecione</option>
          <option>Eletrônico</option>
          <option id="opcao-bloco-posto">Posto de Serviço</option>
          <option>Administração</option>
        </select>
      </div>
      <div class="nps-campo hidden" id="campo-posto">
        <label class="nps-campo-rotulo" for="posto">Posto <span class="obrigatorio" aria-hidden="true">*</span></label>
        <select id="posto"></select>
      </div>
      <div class="nps-campo">
        <label class="nps-campo-rotulo" for="nomeFuncionario">Nome do funcionário <span class="obrigatorio" aria-hidden="true">*</span></label>
        <input type="text" id="nomeFuncionario" required autocomplete="off" />
      </div>
      <div class="nps-campo">
        <label class="nps-campo-rotulo" for="demissao">Demissão <span class="obrigatorio" aria-hidden="true">*</span></label>
        <select id="demissao" required>
          <option value="" disabled selected>Selecione</option>
          <option>Pedido de demissão</option>
          <option>Desligado</option>
          <option>Justa Causa</option>
          <option>Fim da Experiência</option>
          <option>Abandono de emprego</option>
          <option>Acordo legal</option>
        </select>
      </div>
      <div class="nps-campo hidden" id="campo-aviso-previo">
        <label class="nps-campo-rotulo" for="avisoPrevio">Aviso Prévio <span class="obrigatorio" aria-hidden="true">*</span></label>
        <select id="avisoPrevio"></select>
      </div>
      <div class="hidden" id="campos-datas-aviso">
        <div class="linha2">
          <div class="nps-campo">
            <label class="nps-campo-rotulo" for="avisoPrevioInicio">Data inicial do Aviso Prévio</label>
            <input type="date" id="avisoPrevioInicio" />
          </div>
          <div class="nps-campo">
            <label class="nps-campo-rotulo" for="avisoPrevioFim">Data final do Aviso Prévio</label>
            <input type="date" id="avisoPrevioFim" />
          </div>
        </div>
      </div>
      <div class="nps-campo">
        <label class="nps-campo-rotulo" for="dataAdmissao">Data de admissão <span class="obrigatorio" aria-hidden="true">*</span></label>
        <input type="date" id="dataAdmissao" required />
      </div>
      <div class="nps-campo">
        <label class="nps-campo-rotulo" for="dataDemissao">Data de demissão <span class="obrigatorio" aria-hidden="true">*</span></label>
        <input type="date" id="dataDemissao" required />
      </div>
      <div class="nps-campo">
        <span class="nps-campo-rotulo">Tempo de serviço</span>
        <div class="valor-leitura" id="tempoServico"></div>
      </div>
      <div class="nps-campo hidden" id="campo-motivo">
        <label class="nps-campo-rotulo" for="motivo">Motivo <span class="obrigatorio" aria-hidden="true">*</span></label>
        <select id="motivo"></select>
      </div>
      <div class="nps-campo">
        <label class="nps-campo-rotulo" for="responsavelCargo">Responsável <span class="obrigatorio" aria-hidden="true">*</span></label>
        <select id="responsavelCargo" required>
          <option value="" disabled selected>Selecione</option>
          <option>Diretoria</option>
          <option>Gerência</option>
          <option>RH</option>
        </select>
      </div>
      <div class="nps-campo hidden" id="campo-responsavel-nome">
        <label class="nps-campo-rotulo" for="responsavelNome">Nome do responsável <span class="obrigatorio" aria-hidden="true">*</span></label>
        <select id="responsavelNome"></select>
      </div>
      <button type="submit" class="btn-primary nps-enviar" id="btn-enviar">Enviar</button>
    </form>

    <div class="sucesso hidden" id="card-sucesso">
      <span class="material-icons-outlined" aria-hidden="true">check_circle</span>
      <p>Formulário enviado com sucesso.</p>
      <div class="sucesso-protocolo" id="protocolo-gerado"></div>
      <p>Guarde este número de protocolo.</p>
    </div>
  </div>
</main>

<script>
(function () {
  "use strict";

  var API_URL = "https://vegas-hub.vercel.app/api/central-de-controle/demissao/submit";
  var POSTOS_API_URL = "https://vegas-hub.vercel.app/api/central-de-controle/demissao/postos";

  var AVISO_PREVIO_POR_DEMISSAO = {
    "Pedido de demissão": ["Realizado", "Não realizado"],
    "Desligado": ["Realizado", "Indenizado"],
    "Acordo legal": ["Realizado", "Não realizado", "Indenizado"],
  };
  var MOTIVOS_POR_DEMISSAO = {
    "Pedido de demissão": [
      "Insatisfação profissional",
      "Nova oportunidade profissional",
      "Questões relacionadas a gestão",
      "Mudança de domicílio",
      "Questões pessoais",
      "Não informado",
    ],
    "Desligado": [
      "Desempenho abaixo do esperado",
      "Redução de custos",
      "Encerramento do posto",
      "Absenteísmo elevado",
      "Elevado número de afastamentos",
      "Rescisão por acordo",
      "Deliberação da diretoria",
      "Não informado",
    ],
    "Justa Causa": ["Justa causa"],
  };
  var NOMES_POR_CARGO = {
    "Diretoria": ["Juliano", "Gil"],
    "Gerência": ["Vitor", "Talita"],
    "RH": ["Carolina", "Hilda", "Simone"],
  };

  var $ = function (id) { return document.getElementById(id); };


  function atualizarBotaoTema() {
    var escuro = document.documentElement.getAttribute("data-theme") === "dark";
    $("icone-tema").textContent = escuro ? "light_mode" : "dark_mode";
    var r = escuro ? "Usar tema claro" : "Usar tema escuro";
    $("btn-tema").setAttribute("aria-label", r);
    $("btn-tema").title = r;
  }
  $("btn-tema").addEventListener("click", function () {
    var escuro = document.documentElement.getAttribute("data-theme") === "dark";
    if (escuro) document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", "dark");
    try { localStorage.setItem("vegas-connect-theme", escuro ? "light" : "dark"); } catch (e) {}
    atualizarBotaoTema();
  });
  atualizarBotaoTema();

  var elUnidade = $("unidade");
  var elBloco = $("bloco");
  var elOpcaoBlocoPosto = $("opcao-bloco-posto");
  var elCampoPosto = $("campo-posto");
  var elPosto = $("posto");
  var elNome = $("nomeFuncionario");
  var elDemissao = $("demissao");
  var elCampoAviso = $("campo-aviso-previo");
  var elAviso = $("avisoPrevio");
  var elCamposDatasAviso = $("campos-datas-aviso");
  var elAvisoInicio = $("avisoPrevioInicio");
  var elAvisoFim = $("avisoPrevioFim");
  var elDataAdmissao = $("dataAdmissao");
  var elDataDemissao = $("dataDemissao");
  var elTempoServico = $("tempoServico");
  var elCampoMotivo = $("campo-motivo");
  var elMotivo = $("motivo");
  var elResponsavelCargo = $("responsavelCargo");
  var elCampoResponsavelNome = $("campo-responsavel-nome");
  var elResponsavelNome = $("responsavelNome");
  var elForm = $("form-demissao");
  var elBtnEnviar = $("btn-enviar");
  var elErroBox = $("erro-geral-box");
  var elErro = $("erro-geral");
  var elCardSucesso = $("card-sucesso");
  var elProtocoloGerado = $("protocolo-gerado");

  function preencherSelect(select, opcoes, comPlaceholder) {
    select.innerHTML = "";
    if (comPlaceholder) {
      var ph = document.createElement("option");
      ph.value = "";
      ph.disabled = true;
      ph.selected = true;
      ph.textContent = "Selecione";
      select.appendChild(ph);
    }
    opcoes.forEach(function (op) {
      var o = document.createElement("option");
      o.value = op;
      o.textContent = op;
      select.appendChild(o);
    });
  }

  // ── Posto (só aparece com Bloco = "Posto de Serviço") ──
  var nomesPostos = null; // null = ainda não carregou
  fetch(POSTOS_API_URL)
    .then(function (res) { return res.json(); })
    .then(function (json) {
      if (!json.ok) throw new Error(json.erro || "Falha ao carregar postos");
      nomesPostos = json.postos.map(function (p) { return p.cidade ? (p.nome + " — " + p.cidade) : p.nome; });
      atualizarCampoPosto();
    })
    .catch(function () {
      nomesPostos = [];
      if (!elCampoPosto.classList.contains("hidden")) {
        elPosto.innerHTML = '<option value="" disabled selected>Não foi possível carregar os postos, recarregue a página</option>';
      }
    });

  // Bloco "Posto de Serviço" só existe em Volta Redonda; em Niterói não tem
  // posto cadastrado, então a opção fica indisponível.
  function atualizarOpcaoBlocoPorUnidade() {
    var niteroi = elUnidade.value === "Niterói";
    elOpcaoBlocoPosto.disabled = niteroi;
    if (niteroi && elBloco.value === "Posto de Serviço") {
      elBloco.value = "";
      atualizarCampoPosto();
    }
  }

  function atualizarCampoPosto() {
    if (elBloco.value !== "Posto de Serviço") {
      elCampoPosto.classList.add("hidden");
      elPosto.value = "";
      return;
    }
    elCampoPosto.classList.remove("hidden");
    if (nomesPostos === null) {
      elPosto.innerHTML = '<option value="" disabled selected>Carregando</option>';
    } else {
      preencherSelect(elPosto, nomesPostos, true);
    }
  }

  function hoje() {
    var d = new Date();
    var tz = new Date(d.toLocaleString("en-US", { timeZone: "America/Sao_Paulo" }));
    var y = tz.getFullYear(), m = String(tz.getMonth() + 1).padStart(2, "0"), day = String(tz.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  function tempoDeServico(inicioYMD, fimYMD) {
    var pi = inicioYMD.split("-").map(Number), pf = fimYMD.split("-").map(Number);
    var ai = pi[0], mi = pi[1], di = pi[2];
    // Inclusivo: conta o dia da admissão e o da demissão (soma 1 dia ao fim).
    var fim1 = new Date(Date.UTC(pf[0], pf[1] - 1, pf[2] + 1));
    var af = fim1.getUTCFullYear(), mf = fim1.getUTCMonth() + 1, df = fim1.getUTCDate();
    var anos = af - ai, meses = mf - mi, dias = df - di;
    if (dias < 0) {
      meses -= 1;
      dias += new Date(af, mf - 1, 0).getDate();
    }
    if (meses < 0) { anos -= 1; meses += 12; }
    if (anos < 0) return "";
    var partes = [];
    if (anos > 0) partes.push(anos + " ano" + (anos !== 1 ? "s" : ""));
    if (meses > 0) partes.push(meses + " " + (meses !== 1 ? "meses" : "mês"));
    if (dias > 0 || partes.length === 0) partes.push(dias + " dia" + (dias !== 1 ? "s" : ""));
    if (partes.length === 1) return partes[0];
    return partes.slice(0, -1).join(", ") + " e " + partes[partes.length - 1];
  }

  function atualizarAvisoPrevio() {
    var opcoes = AVISO_PREVIO_POR_DEMISSAO[elDemissao.value];
    elAviso.value = "";
    elAvisoInicio.value = "";
    elAvisoFim.value = "";
    if (opcoes) {
      elCampoAviso.classList.remove("hidden");
      preencherSelect(elAviso, opcoes, true);
    } else {
      elCampoAviso.classList.add("hidden");
      elCamposDatasAviso.classList.add("hidden");
    }
    atualizarMotivo();
    atualizarTempoServico();
  }

  function atualizarDatasAviso() {
    if (elAviso.value === "Realizado") {
      elCamposDatasAviso.classList.remove("hidden");
    } else {
      elCamposDatasAviso.classList.add("hidden");
      elAvisoInicio.value = "";
      elAvisoFim.value = "";
    }
    atualizarTempoServico();
  }

  function atualizarMotivo() {
    var opcoes = MOTIVOS_POR_DEMISSAO[elDemissao.value];
    if (opcoes) {
      elCampoMotivo.classList.remove("hidden");
      if (elDemissao.value === "Justa Causa") {
        preencherSelect(elMotivo, opcoes, false);
        elMotivo.disabled = true;
      } else {
        elMotivo.disabled = false;
        preencherSelect(elMotivo, opcoes, true);
      }
    } else {
      elCampoMotivo.classList.add("hidden");
      elMotivo.value = "";
    }
  }

  function atualizarTempoServico() {
    var inicio = elDataAdmissao.value;
    var fim = elDataDemissao.value || elAvisoFim.value || hoje();
    if (!inicio) { elTempoServico.textContent = ""; return; }
    elTempoServico.textContent = tempoDeServico(inicio, fim);
  }

  function atualizarMinDataDemissao() {
    elDataDemissao.min = elDataAdmissao.value || "";
  }

  function atualizarResponsavelNome() {
    var opcoes = NOMES_POR_CARGO[elResponsavelCargo.value];
    if (opcoes) {
      elCampoResponsavelNome.classList.remove("hidden");
      preencherSelect(elResponsavelNome, opcoes, true);
    } else {
      elCampoResponsavelNome.classList.add("hidden");
      elResponsavelNome.value = "";
    }
  }

  elUnidade.addEventListener("change", atualizarOpcaoBlocoPorUnidade);
  elBloco.addEventListener("change", atualizarCampoPosto);
  elDemissao.addEventListener("change", atualizarAvisoPrevio);
  elAviso.addEventListener("change", atualizarDatasAviso);
  elDataAdmissao.addEventListener("change", atualizarTempoServico);
  elDataAdmissao.addEventListener("change", atualizarMinDataDemissao);
  elDataDemissao.addEventListener("change", atualizarTempoServico);
  elAvisoFim.addEventListener("change", atualizarTempoServico);
  elResponsavelCargo.addEventListener("change", atualizarResponsavelNome);

  // ── Envio ──
  function mostrarErro(msg) {
    elErro.textContent = msg;
    elErroBox.style.display = "block";
    elErroBox.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function ocultarErro() {
    elErroBox.style.display = "none";
  }

  elForm.addEventListener("submit", function (e) {
    e.preventDefault();
    ocultarErro();

    if (!elCampoPosto.classList.contains("hidden") && !elPosto.value) {
      mostrarErro("Selecione o Posto.");
      return;
    }
    if (elAviso && !elCampoAviso.classList.contains("hidden") && !elAviso.value) {
      mostrarErro("Selecione o Aviso Prévio.");
      return;
    }
    if (!elCampoMotivo.classList.contains("hidden") && !elMotivo.value) {
      mostrarErro("Selecione o Motivo.");
      return;
    }
    if (!elCampoResponsavelNome.classList.contains("hidden") && !elResponsavelNome.value) {
      mostrarErro("Selecione o nome do responsável.");
      return;
    }
    if (!elForm.reportValidity()) return;

    if (elDataAdmissao.value && elDataAdmissao.value > hoje()) {
      mostrarErro("Data de admissão não pode ser uma data futura.");
      return;
    }
    if (elDataDemissao.value && elDataAdmissao.value && elDataDemissao.value < elDataAdmissao.value) {
      mostrarErro("Data de demissão não pode ser antes da data de admissão.");
      return;
    }
    if (!elCamposDatasAviso.classList.contains("hidden") && elAvisoInicio.value && elAvisoInicio.value > hoje()) {
      mostrarErro("Data inicial do Aviso Prévio não pode ser uma data futura.");
      return;
    }
    if (!elCamposDatasAviso.classList.contains("hidden") && elAvisoFim.value && elAvisoFim.value < hoje()) {
      mostrarErro("Data final do Aviso Prévio não pode ser antes do dia vigente.");
      return;
    }

    var payload = {
      unidade: elUnidade.value,
      bloco: elBloco.value,
      posto: elCampoPosto.classList.contains("hidden") ? null : (elPosto.value || null),
      nomeFuncionario: elNome.value.trim(),
      demissao: elDemissao.value,
      avisoPrevio: elCampoAviso.classList.contains("hidden") ? null : (elAviso.value || null),
      avisoPrevioInicio: elCamposDatasAviso.classList.contains("hidden") ? null : (elAvisoInicio.value || null),
      avisoPrevioFim: elCamposDatasAviso.classList.contains("hidden") ? null : (elAvisoFim.value || null),
      dataAdmissao: elDataAdmissao.value,
      dataDemissao: elDataDemissao.value,
      motivo: elCampoMotivo.classList.contains("hidden") ? null : (elMotivo.value || null),
      responsavelCargo: elResponsavelCargo.value,
      responsavelNome: elCampoResponsavelNome.classList.contains("hidden") ? null : (elResponsavelNome.value || null),
    };

    elBtnEnviar.disabled = true;
    elBtnEnviar.textContent = "Enviando";

    fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    })
      .then(function (res) {
        return res.json().then(function (json) { return { status: res.status, json: json }; });
      })
      .then(function (r) {
        if (!r.json.ok) throw new Error(r.json.erro || "Falha ao enviar o formulário.");
        elForm.classList.add("hidden");
        elProtocoloGerado.textContent = r.json.protocolo;
        elCardSucesso.classList.remove("hidden");
        elCardSucesso.scrollIntoView({ behavior: "smooth", block: "start" });
      })
      .catch(function (err) {
        mostrarErro(err.message || "Não foi possível enviar. Verifique sua conexão e tente novamente.");
      })
      .finally(function () {
        elBtnEnviar.disabled = false;
        elBtnEnviar.textContent = "Enviar";
      });
  });

  elDataAdmissao.max = hoje();
  elAvisoInicio.max = hoje();
  elAvisoFim.min = hoje();
  atualizarMinDataDemissao();

  atualizarAvisoPrevio();
})();
</script>
</body>
</html>
